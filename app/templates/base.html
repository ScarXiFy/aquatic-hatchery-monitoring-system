<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aquatic Hatchery Monitoring System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="{% block body_class %}dashboard-body{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span>Aquatic Hatchery Monitoring System</span>
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="{{ url_for('main.index') }}" class="{% if request.endpoint == 'main.index' %}active{% endif %}">Home</a>
      <a href="{{ url_for('main.graph') }}" class="{% if request.endpoint == 'main.graph' %}active{% endif %}">View Graph</a>
    </nav>

    <div class="topbar-actions">
      <span class="status-pill" id="status-indicator-nav">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 12h4l3-7 4 14 3-7h4" />
        </svg>
        Optimal</span>
      <time id="current-date-time" datetime="">--</time>
      <button class="icon-button sound-toggle-btn" id="sound-toggle-btn" type="button" aria-label="Toggle sound alerts" title="Toggle sound alerts">
        <span class="sound-icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </span>
      </button>
      <div class="notification-wrapper">
        <button class="icon-button" id="notification-bell-btn" type="button" aria-label="View notifications">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span id="notification-badge" class="notification-badge" hidden>0</span>
        </button>

        <div id="notification-dropdown" class="notification-dropdown" hidden>
          <div class="notification-dropdown-header">
            <strong>Notifications</strong>
            <button id="clear-notifications-btn" type="button" class="text-button">Clear all</button>
          </div>
          <div id="notification-list" class="notification-list">
            <p class="notification-empty">No notifications yet.</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <!-- Warning Alert Modal Overlay -->
  <div id="alert-modal-overlay" class="alert-modal-overlay" hidden aria-modal="true" role="dialog">
    <div class="alert-modal-card">
      <div class="alert-modal-header">
        <div class="alert-title-wrap">
          <span class="alert-icon-warning">⚠️</span>
          <h2>System Alert</h2>
        </div>
        <div class="alert-modal-actions">
          <button id="alert-modal-sound-btn" type="button" class="alert-action-btn sound-toggle-btn" title="Toggle sound alerts">
            <span class="sound-icon-wrap"></span>
          </button>
          <button id="alert-modal-minimize-btn" type="button" class="alert-action-btn" title="Minimize">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <button id="alert-modal-close-btn" type="button" class="alert-action-btn alert-close-btn" title="Close & send to notification bell">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div id="alert-modal-body" class="alert-modal-body">
        <!-- Text list inserted via JS -->
      </div>
    </div>
  </div>

  <!-- Docked Floating Card -->
  <div id="alert-docked-card" class="alert-docked-card" hidden>
    <div class="alert-docked-content" id="alert-docked-expand-trigger" title="Click to expand alert modal">
      <span class="alert-docked-icon">⚠️</span>
      <div id="alert-docked-text" class="alert-docked-text">
        <!-- Compact info inserted via JS -->
      </div>
    </div>
    <button id="alert-docked-close-btn" type="button" class="alert-docked-close" title="Dismiss to notification bell">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Alert Audio Elements -->
  <audio id="audio-alert-warning" data-alert-type="warning" data-alert-level="warning" src="/static/sounds/alert-warning.mp3" preload="auto"></audio>
  <audio id="audio-alert-critical" data-alert-type="critical" data-alert-level="critical" src="/static/sounds/alert-critical.mp3" preload="auto"></audio>

  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
